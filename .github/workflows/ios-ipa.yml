name: iOS IPA (unsigned, for sideloading)

# Builds an UNSIGNED .ipa for a real iPhone and publishes it to the
# `ios-ipa-latest` release. It is not signed, so it will NOT install by
# double-clicking — install it with AltStore or Sideloadly using your own
# (free) Apple ID, which re-signs it on device. Free-Apple-ID apps expire
# after 7 days; AltStore can auto-refresh. See docs/BUILDS.md.
#
# Manual only (macOS runners are ~10x Linux cost); public repos get free
# macOS minutes. Runs on push only when this workflow file itself changes.

on:
  workflow_dispatch:
  push:
    branches: [main, ci/ios-ipa]
    paths: ['.github/workflows/ios-ipa.yml']

permissions:
  contents: write

jobs:
  build:
    # macos-15 ships Xcode 16.x; React Native 0.86 requires Xcode >= 16.1.
    runs-on: macos-15
    # Building RN from source (no prebuilt) is slower than the xcframework path.
    timeout-minutes: 120
    env:
      # Force React Native + Expo modules to build FROM SOURCE. Expo 57's
      # prebuilt path spawns an ExpoModulesJSI xcframework build that fails
      # Swift Package resolution in unsigned CI. Must be set for pod install
      # AND the xcodebuild archive, so it lives at the job level.
      RCT_USE_PREBUILT_RNCORE: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 16
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Archive unsigned app for device
        working-directory: ios
        run: |
          set -eo pipefail
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(xcodebuild -list -json -workspace "$WS" | node -e "
            const j=JSON.parse(require('fs').readFileSync(0,'utf8'));
            const schemes=(j.workspace&&j.workspace.schemes)||(j.project&&j.project.schemes)||[];
            const s=schemes.filter(x=>!/Pods|expo-dev/i.test(x));
            console.log(s[0]||schemes[0]||'');
          ")
          if [ -z "$SCHEME" ]; then echo '::error::Could not determine Xcode scheme'; exit 1; fi
          echo "Workspace: $WS  Scheme: $SCHEME"
          # Pre-resolve Swift packages into a stable, shared clone dir first —
          # Expo 57 builds ExpoModulesJSI as an xcframework via a nested build
          # that was failing with "Could not resolve package dependencies".
          xcodebuild -resolvePackageDependencies \
            -workspace "$WS" -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath build/SourcePackages || true
          # `archive` + generic/platform=iOS is the correct device build.
          # No pipe → xcodebuild's own exit code (and full log) propagate.
          xcodebuild archive \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HoopAI.xcarchive \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -scmProvider system \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package unsigned .ipa
        working-directory: ios
        run: |
          APP=$(find build/HoopAI.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app in archive"; exit 1; fi
          echo "Packaging $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "$GITHUB_WORKSPACE/HoopAI-unsigned.ipa" Payload
          ls -la "$GITHUB_WORKSPACE/HoopAI-unsigned.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoopAI-ios-ipa
          path: HoopAI-unsigned.ipa
          if-no-files-found: error

      - name: Publish to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-ipa-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ios-ipa-latest HoopAI-unsigned.ipa \
            --title "HoopAI — iOS IPA (unsigned, sideload)" \
            --notes "UNSIGNED iOS build from ${{ github.sha }}. It will NOT install by tapping — sideload it with AltStore or Sideloadly using your free Apple ID (it re-signs on device). Free-Apple-ID apps expire after 7 days; AltStore auto-refreshes. Steps in docs/BUILDS.md. Runs in demo mode until a trained model is bundled."
