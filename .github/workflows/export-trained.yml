name: Export trained model (Path B)

# Converts Kaggle-trained YOLO11 weights (kaggle/best.pt) to a FP32 TFLite for
# the app. Runs on CPU (no P100/torch constraint that broke the in-kernel
# export), so latest ultralytics + its matching torch export cleanly.
# Inputs let one workflow produce different sizes (640 quality / 320 speed).

on:
  workflow_dispatch:
    inputs:
      imgsz:
        description: 'Input size (640 quality, 320 speed)'
        default: '640'
      weights:
        description: 'Weights path in repo'
        default: 'kaggle/best.pt'
      artifact:
        description: 'Artifact name'
        default: 'hoopai-det-pathb'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ultralytics
        run: pip install --quiet ultralytics

      - name: Export weights -> TFLite
        env:
          IMGSZ: ${{ inputs.imgsz }}
          WEIGHTS: ${{ inputs.weights }}
        run: |
          python - <<'PY'
          import glob, shutil, os, pathlib
          from ultralytics import YOLO
          imgsz = int(os.environ.get("IMGSZ", "640"))
          weights = os.environ.get("WEIGHTS", "kaggle/best.pt")
          m = YOLO(weights)
          print("CLASSES:", m.names, "IMGSZ:", imgsz, flush=True)
          out = m.export(format="tflite", imgsz=imgsz, nms=False)
          print("EXPORT RETURNED:", out, flush=True)
          cands = []
          p = pathlib.Path(str(out))
          if p.is_file() and p.suffix == ".tflite":
              cands = [str(p)]
          elif p.is_dir():
              cands = [str(x) for x in p.rglob("*.tflite")]
          if not cands:
              cands = glob.glob("**/*.tflite", recursive=True)
          cands.sort(key=lambda c: (0 if "float32" in c else 1 if "float16" in c else 2))
          assert cands, "no tflite produced"
          print("PICKED:", cands[0], flush=True)
          shutil.copy(cands[0], "hoopai-det.tflite")
          print("TFLITE_KB:", os.path.getsize("hoopai-det.tflite") // 1024, flush=True)
          open("model-classes.txt", "w").write(str(m.names) + f"\nimgsz={imgsz}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            hoopai-det.tflite
            model-classes.txt
          if-no-files-found: error
