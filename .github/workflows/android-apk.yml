name: Android APK

# Builds a sideloadable release APK with no Expo/EAS account required, then
# publishes it to a rolling "android-latest" GitHub Release so there is always
# a stable download link. Also runs on version tags (v*) for pinned releases.

on:
  push:
    branches: [main]
    tags: ['v*']
    # Don't rebuild Android for docs or iOS-only workflow changes.
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'notebooks/**'
      - 'training/**'
      - '.github/workflows/ios-*.yml'
  workflow_dispatch:

# Only one APK build at a time; newer pushes cancel older in-flight builds.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

      - name: Prebuild native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Configure Gradle properties
        run: |
          # Leading newline: prebuild's gradle.properties may end WITHOUT a
          # trailing newline, so a plain `echo >>` would concatenate onto the
          # last key (e.g. minSdkVersion=26org.gradle.jvmargs=...). printf with
          # a leading \n guarantees each key lands on its own line.
          printf '\norg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties
          # Guarantee a valid JSON value for Expo's inline-modules autolinking
          # step (mirror-kotlin-inline-modules JSON.parses this; empty crashes
          # configuration). Last key wins, overriding any empty value prebuild
          # may emit in CI.
          printf 'expo.inlineModules.watchedDirectories=[]\n' >> android/gradle.properties
          echo "--- tail of gradle.properties ---"
          tail -6 android/gradle.properties

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/hoopai.keystore" \
            -alias hoopai -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass hoopai-ci -keypass hoopai-ci \
            -dname "CN=HoopAI, OU=Dev, O=HoopAI, L=Taipei, S=Taipei, C=TW"

      - name: Build release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/hoopai.keystore" \
            -Pandroid.injected.signing.store.password=hoopai-ci \
            -Pandroid.injected.signing.key.alias=hoopai \
            -Pandroid.injected.signing.key.password=hoopai-ci

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/HoopAI.apk
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HoopAI-apk
          path: dist/HoopAI.apk
          if-no-files-found: error

      - name: Publish to rolling release (main / manual)
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest dist/HoopAI.apk \
            --title "HoopAI — latest Android build" \
            --notes "Sideloadable debug-keystore APK built from ${{ github.sha }}. Enable 'Install unknown apps' on your phone, download HoopAI.apk, tap to install. Runs in demo mode until a trained model is bundled (see docs/MODELS.md)."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/HoopAI.apk \
            --title "HoopAI ${{ github.ref_name }}" \
            --notes "HoopAI ${{ github.ref_name }} — Android APK." || \
          gh release upload "${{ github.ref_name }}" dist/HoopAI.apk --clobber
